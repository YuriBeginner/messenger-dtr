<!DOCTYPE html>
<html>
<head>
    <title>Create University</title>
</head>
<body>

<h1>Create University</h1>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;">{{ success }}</p>
{% endif %}

<form method="POST">
    <h3>University Info</h3>
    <input type="text" name="name" placeholder="University Name"><br><br>

    <h3>Admin Info</h3>
    <input type="text" name="admin_name" placeholder="Admin Name"><br><br>
    <input type="email" name="admin_email" placeholder="Admin Email"><br><br>
    <input type="password" name="password" placeholder="Password"><br><br>

    <button type="submit">Create</button>
</form>

<br>
<a href="/superadmin/dashboard">← Back to Dashboard</a>

</body>
</html>
